name: Crawl Reebok products

on:
  schedule:
    - cron: "0 19 * * *" # 毎朝4:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node crawl.js
      - name: Commit updated product data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/products.json
          git diff --cached --quiet || git commit -m "chore: update product data"
          git pull --rebase
          git push
